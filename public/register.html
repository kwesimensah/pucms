<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PUCMS — Register</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="auth-page">
  <aside class="auth-visual" aria-hidden="true">
    <img class="auth-logo" src="https://upload.wikimedia.org/wikipedia/commons/5/59/Coat_of_arms_of_Ghana.svg" alt="">
    <div class="auth-visual-copy">
      <strong>PUCMS</strong>
      <span>Public Utility Complaint Management System.<br>Create your account to get started.</span>
    </div>
    <div class="auth-steps">
      <span class="active"><b>1</b>Sign up<br>your account</span>
      <span><b>2</b>Set up your<br>profile</span>
      <span><b>3</b>Submit your<br>first complaint</span>
    </div>
  </aside>
  <div class="auth-card">
    <h1>Create your citizen account</h1>
    <p class="sub">Register to submit and track public utility complaints.</p>
    <div id="alert"></div>
    <form id="regForm">
      <div class="form-group">
        <label for="fullName">Full name</label>
        <input type="text" id="fullName" required placeholder="e.g. Ama Serwaa">
      </div>
      <div class="form-group">
        <label for="email">Email address</label>
        <input type="email" id="email" required placeholder="you@example.com">
      </div>
      <div class="form-group">
        <label for="phone">Phone number</label>
        <input type="tel" id="phone" required placeholder="+233 XX XXX XXXX">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" required placeholder="At least 6 characters">
      </div>
      <button type="submit" class="btn" style="width:100%">Create Account</button>
    </form>
    <div class="auth-links">
      Already have an account? <a href="index.html">Sign in</a>
    </div>
  </div>
  <div class="powered-by" aria-label="Powered by Head Start">
    <span>Powered by</span>
    <strong><i>HEAD</i><span>/</span><i>START</i></strong>
  </div>
</div>
<script src="js/api.js"></script>
<script>
if (Session.isLoggedIn()) {
  window.location.href = Session.role === 'admin' ? 'admin-dashboard.html' : 'citizen-dashboard.html';
}

document.getElementById('regForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  clearAlert('alert');
  const fullName = document.getElementById('fullName').value.trim();
  const email = document.getElementById('email').value.trim();
  const phone = document.getElementById('phone').value.trim();
  const password = document.getElementById('password').value;
  const btn = e.target.querySelector('button[type="submit"]');
  btn.disabled = true; btn.textContent = 'Creating account…';
  try {
    const data = await Api.post('/auth/register', { fullName, email, phone, password });
    Session.set(data.token, 'citizen', data.user.fullName);
    window.location.href = 'citizen-dashboard.html';
  } catch (err) {
    showAlert('alert', err.message, 'error');
    btn.disabled = false; btn.textContent = 'Create Account';
  }
});
</script>
</body>
</html>
