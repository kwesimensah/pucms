<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PUCMS — Manage Complaints</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="nav"></div>
<div class="page-wrap">
  <div class="page-header">
    <div>
      <h1>Complaint Management</h1>
      <p>Filter, search, and manage all citizen complaints across every utility.</p>
    </div>
  </div>

  <div class="card">
    <div class="filter-bar">
      <div class="form-group">
        <label>Search</label>
        <input type="text" id="fSearch" placeholder="Complaint # / title / description">
      </div>
      <div class="form-group">
        <label>Utility</label>
        <select id="fUtility">
          <option value="">All</option>
          <option>Electricity</option><option>Water</option><option>Sanitation</option><option>Telecommunications</option>
        </select>
      </div>
      <div class="form-group">
        <label>Category</label>
        <select id="fCategory">
          <option value="">All</option>
          <option>Power Outage</option><option>Billing Dispute</option><option>Water Supply Issue</option>
          <option>Network Connectivity</option><option>Sanitation</option><option>General</option>
        </select>
      </div>
      <div class="form-group">
        <label>Status</label>
        <select id="fStatus">
          <option value="">All</option>
          <option>Submitted</option><option>Under Review</option><option>Assigned</option>
          <option>In Progress</option><option>Resolved</option><option>Closed</option>
        </select>
      </div>
      <div class="form-group">
        <label>Priority</label>
        <select id="fPriority">
          <option value="">All</option>
          <option>Low</option><option>Medium</option><option>High</option><option>Critical</option>
        </select>
      </div>
      <div class="form-group">
        <label>Min AI Confidence</label>
        <select id="fConfidence">
          <option value="">Any</option>
          <option value="0.5">≥ 50%</option>
          <option value="0.7">≥ 70%</option>
          <option value="0.9">≥ 90%</option>
        </select>
      </div>
      <button class="btn" id="applyFilters">Apply Filters</button>
      <button class="btn ghost" id="clearFilters">Clear</button>
    </div>
  </div>

  <div class="card">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
      <div class="section-title" style="margin:0;" id="resultCount">Complaints</div>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>ID</th><th>Citizen</th><th>Utility</th><th>Category</th><th>Priority</th>
            <th>Status</th><th>Submitted</th><th>AI Confidence</th><th>Assigned</th><th></th>
          </tr>
        </thead>
        <tbody id="body"><tr><td colspan="10" class="muted">Loading…</td></tr></tbody>
      </table>
    </div>
  </div>
</div>
<script src="js/api.js"></script>
<script>
requireLogin('admin');
document.getElementById('nav').innerHTML = renderTopbar('complaints');

function buildQuery() {
  const params = new URLSearchParams();
  const search = document.getElementById('fSearch').value.trim();
  const utility = document.getElementById('fUtility').value;
  const category = document.getElementById('fCategory').value;
  const status = document.getElementById('fStatus').value;
  const priority = document.getElementById('fPriority').value;
  const minConfidence = document.getElementById('fConfidence').value;
  if (search) params.set('search', search);
  if (utility) params.set('utility', utility);
  if (category) params.set('category', category);
  if (status) params.set('status', status);
  if (priority) params.set('priority', priority);
  if (minConfidence) params.set('minConfidence', minConfidence);
  return params.toString();
}

function confidencePill(conf) {
  if (conf == null) return '—';
  const pct = Math.round(conf * 100);
  return `<div class="confidence-bar"><div class="confidence-track"><div class="confidence-fill" style="width:${pct}%"></div></div><span>${pct}%</span></div>`;
}

async function load() {
  const body = document.getElementById('body');
  body.innerHTML = `<tr><td colspan="10" class="muted">Loading…</td></tr>`;
  try {
    const qs = buildQuery();
    const { complaints } = await Api.get(`/admin/complaints${qs ? '?' + qs : ''}`);
    document.getElementById('resultCount').textContent = `Complaints (${complaints.length})`;
    if (!complaints.length) {
      body.innerHTML = `<tr><td colspan="10"><div class="empty-state">No complaints match these filters.</div></td></tr>`;
      return;
    }
    body.innerHTML = complaints.map(c => `
      <tr>
        <td><a href="admin-complaint-detail.html?id=${c.id}">${escapeHtml(c.complaintNumber)}</a></td>
        <td>${escapeHtml(c.citizenName)}</td>
        <td>${escapeHtml(c.utility)}</td>
        <td>${escapeHtml(c.category || '—')}</td>
        <td><span class="badge ${priorityClass(c.priority)}">${escapeHtml(c.priority)}</span></td>
        <td><span class="badge ${statusClass(c.status)}">${escapeHtml(c.status)}</span></td>
        <td>${fmtDate(c.createdAt)}</td>
        <td>${confidencePill(c.aiConfidence)}</td>
        <td>${escapeHtml(c.assignedTeam || '—')}</td>
        <td><a href="admin-complaint-detail.html?id=${c.id}" class="btn ghost small">Review</a></td>
      </tr>
    `).join('');
  } catch (err) {
    body.innerHTML = `<tr><td colspan="10"><div class="alert error">${escapeHtml(err.message)}</div></td></tr>`;
  }
}

document.getElementById('applyFilters').addEventListener('click', load);
document.getElementById('clearFilters').addEventListener('click', () => {
  ['fSearch','fUtility','fCategory','fStatus','fPriority','fConfidence'].forEach(id => document.getElementById(id).value = '');
  load();
});
document.getElementById('fSearch').addEventListener('keydown', (e) => { if (e.key === 'Enter') load(); });

load();
</script>
</body>
</html>
