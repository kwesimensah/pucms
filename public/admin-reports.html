<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PUCMS — Reports</title>
<link rel="stylesheet" href="css/styles.css">
<style>
  .bar-chart { display:flex; flex-direction:column; gap:10px; }
  .bar-row { display:flex; align-items:center; gap:10px; font-size:13px; }
  .bar-label { width:170px; flex-shrink:0; color:var(--color-text-muted); }
  .bar-track { flex:1; background:#eef1f4; border-radius:3px; height:16px; overflow:hidden; }
  .bar-fill { height:100%; background: var(--color-primary); }
  .bar-value { width:34px; text-align:right; font-weight:600; flex-shrink:0; }
</style>
</head>
<body>
<div id="nav"></div>
<div class="page-wrap">
  <div class="page-header">
    <div>
      <h1>Reports &amp; Analytics</h1>
      <p>Generate reports across a date range and export the underlying complaints as CSV. <span class="muted">All figures are simulated/demo data.</span></p>
    </div>
  </div>

  <div class="card">
    <div class="filter-bar">
      <div class="form-group">
        <label>Utility</label>
        <select id="fUtility"><option value="">All</option><option>Electricity</option><option>Water</option><option>Sanitation</option><option>Telecommunications</option></select>
      </div>
      <div class="form-group">
        <label>Category</label>
        <select id="fCategory"><option value="">All</option><option>Power Outage</option><option>Billing Dispute</option><option>Water Supply Issue</option><option>Network Connectivity</option><option>Sanitation</option><option>General</option></select>
      </div>
      <div class="form-group">
        <label>Status</label>
        <select id="fStatus"><option value="">All</option><option>Submitted</option><option>Under Review</option><option>Assigned</option><option>In Progress</option><option>Resolved</option><option>Closed</option></select>
      </div>
      <div class="form-group">
        <label>Priority</label>
        <select id="fPriority"><option value="">All</option><option>Low</option><option>Medium</option><option>High</option><option>Critical</option></select>
      </div>
      <div class="form-group">
        <label>From</label>
        <input type="date" id="fFrom">
      </div>
      <div class="form-group">
        <label>To</label>
        <input type="date" id="fTo">
      </div>
      <button class="btn" id="applyBtn">Generate Report</button>
      <button class="btn ghost" id="exportBtn">Export CSV</button>
    </div>
  </div>

  <div class="stat-grid" id="statGrid"></div>

  <div class="grid-2">
    <div class="card">
      <div class="section-title">Category Distribution</div>
      <div class="bar-chart" id="byCategory"></div>
    </div>
    <div class="card">
      <div class="section-title">Status Distribution</div>
      <div class="bar-chart" id="byStatus"></div>
    </div>
  </div>
</div>
<script src="js/api.js"></script>
<script>
requireLogin('admin');
document.getElementById('nav').innerHTML = renderTopbar('reports');

function renderBars(containerId, dataObj) {
  const entries = Object.entries(dataObj || {}).sort((a, b) => b[1] - a[1]);
  const max = Math.max(1, ...entries.map(e => e[1]));
  const el = document.getElementById(containerId);
  if (!entries.length) { el.innerHTML = '<p class="muted">No data for this range.</p>'; return; }
  el.innerHTML = entries.map(([label, value]) => `
    <div class="bar-row">
      <div class="bar-label">${escapeHtml(label)}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${(value / max) * 100}%"></div></div>
      <div class="bar-value">${value}</div>
    </div>
  `).join('');
}

function buildQuery() {
  const params = new URLSearchParams();
  const utility = document.getElementById('fUtility').value;
  const category = document.getElementById('fCategory').value;
  const status = document.getElementById('fStatus').value;
  const priority = document.getElementById('fPriority').value;
  const dateFrom = document.getElementById('fFrom').value;
  const dateTo = document.getElementById('fTo').value;
  if (utility) params.set('utility', utility);
  if (category) params.set('category', category);
  if (status) params.set('status', status);
  if (priority) params.set('priority', priority);
  if (dateFrom) params.set('dateFrom', dateFrom);
  if (dateTo) params.set('dateTo', dateTo);
  return params.toString();
}

async function load() {
  try {
    const qs = buildQuery();
    const { analytics } = await Api.get(`/admin/reports/analytics${qs ? '?' + qs : ''}`);
    document.getElementById('statGrid').innerHTML = `
      <div class="stat-card"><div class="stat-value">${analytics.totalComplaints}</div><div class="stat-label">Total Complaints</div></div>
      <div class="stat-card resolved"><div class="stat-value">${analytics.resolvedComplaints}</div><div class="stat-label">Resolved</div></div>
      <div class="stat-card warning"><div class="stat-value">${analytics.pendingComplaints}</div><div class="stat-label">Pending</div></div>
      <div class="stat-card critical"><div class="stat-value">${analytics.criticalComplaints}</div><div class="stat-label">Critical</div></div>
      <div class="stat-card"><div class="stat-value">${analytics.avgResponseTimeHours}</div><div class="stat-label">Avg Response (hrs)</div></div>
      <div class="stat-card"><div class="stat-value">${analytics.avgResolutionTimeHours}</div><div class="stat-label">Avg Resolution (hrs)</div></div>
    `;
    renderBars('byCategory', analytics.byCategory);
    renderBars('byStatus', analytics.byStatus);
  } catch (err) {
    document.getElementById('statGrid').innerHTML = `<div class="alert error">${escapeHtml(err.message)}</div>`;
  }
}

document.getElementById('applyBtn').addEventListener('click', load);
document.getElementById('exportBtn').addEventListener('click', () => {
  const qs = buildQuery();
  const url = `/api/admin/reports/export.csv${qs ? '?' + qs : ''}`;
  fetch(url, { headers: { Authorization: `Bearer ${Session.token}` } })
    .then(r => r.blob())
    .then(blob => {
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = 'pucms-report.csv';
      link.click();
    });
});

load();
</script>
</body>
</html>
